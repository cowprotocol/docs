name: x402 examples

on:
  pull_request:
    paths:
      - 'docs/cow-protocol/integrate/x402*.mdx'
      - 'static/code-examples/x402/**'
      - 'scripts/check-x402-examples.sh'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/x402-examples.yml'
  push:
    branches: [main]
    paths:
      - 'docs/cow-protocol/integrate/x402*.mdx'
      - 'static/code-examples/x402/**'
      - 'scripts/check-x402-examples.sh'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/x402-examples.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: bash scripts/check-x402-examples.sh
